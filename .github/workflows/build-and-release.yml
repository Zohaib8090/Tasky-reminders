name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already exists."
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "No debug keystore found. Generating valid debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Setup Release Keystore (if secrets provided)
        id: setup-release-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Found KEYSTORE_BASE64 secret, decoding to my-upload-key.jks..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret found."
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out version and build type
        id: plan
        run: |
          HAS_KEY="${{ steps.setup-release-keystore.outputs.HAS_RELEASE_KEY }}"
          INPUT="${{ github.event.inputs.build_type }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
            VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
            # Tagged releases are signed with the fixed release key when it is configured
            if [ "$HAS_KEY" = "true" ]; then BUILD="release"; else BUILD="debug"; fi
          else
            VERSION_NAME="1.0-dev.${{ github.run_number }}"
            VERSION_CODE="${{ github.run_number }}"
            BUILD="${INPUT:-debug}"
            if [ "$BUILD" != "debug" ] && [ "$HAS_KEY" != "true" ]; then
              echo "No release keystore configured; building debug only."
              BUILD="debug"
            fi
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $BUILD, version $VERSION_NAME (code $VERSION_CODE)"

      - name: Build Debug APK
        if: ${{ steps.plan.outputs.build == 'debug' || steps.plan.outputs.build == 'both' }}
        run: ./gradlew assembleDebug -PappVersionName=${{ steps.plan.outputs.version_name }} -PappVersionCode=${{ steps.plan.outputs.version_code }} --stacktrace

      - name: Build Release APK
        if: ${{ steps.plan.outputs.build == 'release' || steps.plan.outputs.build == 'both' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionName=${{ steps.plan.outputs.version_name }} -PappVersionCode=${{ steps.plan.outputs.version_code }} --stacktrace

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskNest-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
