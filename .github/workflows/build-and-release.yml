name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # One cache for Gradle dependencies, wrapper and build outputs. Runs on main save it;
      # tag and pull request builds reuse it.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already exists."
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "No debug keystore found. Generating valid debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Setup Release Keystore (if secrets provided)
        id: setup-release-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Found KEYSTORE_BASE64 secret, decoding to my-upload-key.jks..."
            # Strip any spaces/line breaks picked up when the secret was pasted
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > my-upload-key.jks || true
            echo "Decoded keystore size: $(wc -c < my-upload-key.jks) bytes"
            if keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
              echo "Release keystore is valid."
              echo "HAS_RELEASE_KEY=true" >> "$GITHUB_OUTPUT"
              # PKCS12 keystores (the default) protect the key with the store password itself,
              # so a separate KEY_PASSWORD secret is not needed and can't be wrong.
              if keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | grep -q "Keystore type: PKCS12"; then
                echo "PKCS12 keystore: using STORE_PASSWORD as the key password."
                echo "KEY_IS_STORE=true" >> "$GITHUB_OUTPUT"
              else
                echo "KEY_IS_STORE=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::error::KEYSTORE_BASE64 or STORE_PASSWORD is wrong: the keystore could not be opened. Re-create the KEYSTORE_BASE64 secret with the full output of 'base64 -w0 my-upload-key.jks' and check STORE_PASSWORD."
              exit 1
            fi
          else
            echo "No KEYSTORE_BASE64 secret found."
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out version and build type
        id: plan
        run: |
          HAS_KEY="${{ steps.setup-release-keystore.outputs.HAS_RELEASE_KEY }}"
          INPUT="${{ github.event.inputs.build_type }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
            VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
            # Tagged releases are signed with the fixed release key when it is configured
            if [ "$HAS_KEY" = "true" ]; then BUILD="release"; else BUILD="debug"; fi
          else
            VERSION_NAME="1.0-dev.${{ github.run_number }}"
            VERSION_CODE="${{ github.run_number }}"
            BUILD="${INPUT:-debug}"
            if [ "$BUILD" != "debug" ] && [ "$HAS_KEY" != "true" ]; then
              echo "No release keystore configured; building debug only."
              BUILD="debug"
            fi
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $BUILD, version $VERSION_NAME (code $VERSION_CODE)"

      - name: Build Debug APK
        if: ${{ steps.plan.outputs.build == 'debug' || steps.plan.outputs.build == 'both' }}
        run: ./gradlew assembleDebug -PappVersionName=${{ steps.plan.outputs.version_name }} -PappVersionCode=${{ steps.plan.outputs.version_code }} --stacktrace

      - name: Build Release APK
        if: ${{ steps.plan.outputs.build == 'release' || steps.plan.outputs.build == 'both' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ steps.setup-release-keystore.outputs.KEY_IS_STORE == 'true' && secrets.STORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionName=${{ steps.plan.outputs.version_name }} -PappVersionCode=${{ steps.plan.outputs.version_code }} --stacktrace

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskNest-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
